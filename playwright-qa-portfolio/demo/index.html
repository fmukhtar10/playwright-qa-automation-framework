<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sample Policy Quote</title><style>body{font:16px system-ui;max-width:560px;margin:60px auto;color:#14263f}label,input,button{display:block;margin:12px 0}input,button{padding:10px}button{background:#087f8c;color:white;border:0}#result{margin-top:18px}</style></head><body><h1>Sample policy quote</h1><p>Local demonstration only. No real insurance quote or payment is processed.</p><form id="quote"><label for="name">Applicant name</label><input id="name" required><label for="amount">Coverage amount</label><input id="amount" type="number" min="1000" required><button type="submit">Get sample quote</button></form><p id="result" role="status" aria-live="polite"></p><script>document.querySelector('#quote').addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#name').value.trim();const amount=Number(document.querySelector('#amount').value);document.querySelector('#result').textContent=name&&amount>=1000?`Sample quote created for ${name}: coverage $${amount.toFixed(2)}`:'Please enter a valid name and coverage amount of at least $1000.';});</script></body></html>
